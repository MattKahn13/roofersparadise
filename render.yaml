# Render Blueprint -- free web service built from the Dockerfile.
# The poller + daily refresh run via GitHub Actions (this host sleeps), so ENABLE_WORKERS=0.
# Accounts + subscriptions live in Turso (free hosts have ephemeral disk); the hail Parquet
# is baked into the image and seeded to /data on boot by start.sh.
services:
  - type: web
    name: roofersparadise
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENABLE_WORKERS
        value: "0"
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      # --- set these in the Render dashboard (sync:false = not stored in the repo) ---
      - key: PUBLIC_BASE_URL     # e.g. https://roofersparadise.onrender.com
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
